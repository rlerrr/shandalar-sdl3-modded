name: Windows Release

on:
  push:
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag on main to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify release tag is on main
    if: github.event_name == 'workflow_dispatch' || (github.event.created && !github.event.deleted)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve tag and verify its commit is contained in main
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          sha=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          if ! git merge-base --is-ancestor "$sha" refs/remotes/origin/main; then
            echo "::error::Release tag must point to a commit contained in main."
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.toolchain }} (${{ matrix.arch }})
    needs: verify-tag
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: clang
            arch: x86
            target: i686-pc-windows-msvc
          - toolchain: clang64
            arch: x64
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build with LLVM and the VS2026 STL
        shell: cmd
        run: |
          set "VS_INSTALL="
          for /f "usebackq tokens=*" %%i in (`call "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -version "[18.0,19.0)" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_INSTALL=%%i"
          if not defined VS_INSTALL (
            echo Visual Studio 2026 C++ tools are required. >&2
            exit /b 1
          )
          call "%VS_INSTALL%\Common7\Tools\VsDevCmd.bat" -arch=${{ matrix.arch }} -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          set "PATH=%ProgramFiles%\LLVM\bin;%VS_INSTALL%\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja;%PATH%"
          clang-cl --version
          if errorlevel 1 exit /b %errorlevel%

          cmake -S . -B "out/build/${{ matrix.toolchain }}" -G Ninja ^
            -DCMAKE_BUILD_TYPE=MinSizeRel ^
            -DCMAKE_C_COMPILER=clang-cl ^
            -DCMAKE_CXX_COMPILER=clang-cl ^
            -DCMAKE_C_COMPILER_TARGET=${{ matrix.target }} ^
            -DCMAKE_CXX_COMPILER_TARGET=${{ matrix.target }} ^
            -DCMAKE_EXE_LINKER_FLAGS=/machine:${{ matrix.arch }} ^
            -DCMAKE_SHARED_LINKER_FLAGS=/machine:${{ matrix.arch }} ^
            -DCMAKE_MODULE_LINKER_FLAGS=/machine:${{ matrix.arch }} ^
            -DCMAKE_STATIC_LINKER_FLAGS=/machine:${{ matrix.arch }} ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL ^
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="%CD%/out/bin/${{ matrix.toolchain }}" ^
            -DSHANDALAR_ASSET_DIR:STRING=. ^
            -DSHANDALAR_MODDED_ASSET_DIR:STRING=. ^
            -DSHANDALAR_BUILD_FACEMAKER=OFF ^
            -DSHANDALAR_BUILD_SHANDALAR=ON ^
            -DSHANDALAR_BUILD_DECK=OFF ^
            -DSHANDALAR_BUILD_TESTS=OFF ^
            -DSHANDALAR_BUILD_DUEL_TESTS=OFF
          if errorlevel 1 exit /b %errorlevel%
          cmake --build "out/build/${{ matrix.toolchain }}" --parallel --target shandalar
          exit /b %errorlevel%

      - name: Package Shandalar without game assets
        shell: pwsh
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
          ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
          SOURCE_SHA: ${{ needs.verify-tag.outputs.sha }}
        run: |
          $stage = "out/package/$env:TOOLCHAIN"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath "out/bin/$env:TOOLCHAIN/shandalar.exe" -Destination $stage
          Copy-Item -LiteralPath LICENSE, README.md -Destination $stage
          @{
            repository = $env:GITHUB_REPOSITORY
            tag = $env:RELEASE_TAG
            sha = $env:SOURCE_SHA
            toolchain = $env:TOOLCHAIN
            architecture = $env:ARCH
          } | ConvertTo-Json | Set-Content -LiteralPath "$stage/build-info.json" -Encoding utf8
          @'
          Game assets are not included. Supply your own game data directory:

            shandalar.exe C:/path/to/assets_modded

          See README.md for asset requirements and mod ZIP support.
          '@ | Set-Content -LiteralPath "$stage/README-windows.txt" -Encoding utf8
          Compress-Archive -Path "$stage/*" -DestinationPath "out/shandalar-$env:TOOLCHAIN.zip"

      - name: Upload ${{ matrix.toolchain }} ZIP
        uses: actions/upload-artifact@v7
        with:
          path: out/shandalar-${{ matrix.toolchain }}.zip
          archive: false
          if-no-files-found: error
          overwrite: true

  release:
    name: Publish GitHub release
    needs: [verify-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: shandalar-*.zip
          path: release
          merge-multiple: true
          skip-decompress: true

      - name: Create release or update its assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          test -s release/shandalar-clang.zip
          test -s release/shandalar-clang64.zip
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/shandalar-clang.zip release/shandalar-clang64.zip --clobber
          else
            gh release create "$RELEASE_TAG" release/shandalar-clang.zip release/shandalar-clang64.zip \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
